# Lint, type-check, test, audit and build BLHawk.
# Live bug-bounty scans are NEVER run in CI (pytest excludes the `live` marker).
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Lint (ruff)
      run: ruff check blhawk tests
    - name: Format check (ruff)
      run: ruff format --check blhawk tests
    - name: Type check (mypy)
      run: mypy blhawk
    - name: Tests + coverage (no live scans)
      run: pytest -m "not live" --cov=blhawk --cov-report=term-missing

  audit-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" build
    - name: Dependency audit (pip-audit)
      run: pip-audit || true
    - name: Build package
      run: python -m build
